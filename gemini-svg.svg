<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="background: #080710; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow-core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-mole" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .timeline-track {
        stroke-dasharray: 8 4;
        animation: rotateClockwise 120s linear infinite;
        transform-origin: 400px 400px;
      }
      .universe-line {
        transform-origin: 400px 400px;
        transition: stroke 0.3s, stroke-width 0.3s;
      }
      
      /* Target/Mole Setup */
      .mole-target {
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s;
      }
      
      /* The "Whac" Mechanism: When clicked/active, it vanishes and triggers visual feedback */
      .mole-target:active {
        opacity: 0 !important;
        transform: scale(1.5);
        transform-origin: center;
      }

      /* Game Loop: Randomly popping up anomalies across the 7 timelines using CSS animations */
      @keyframes popUp {
        0%, 15%, 100% { opacity: 0; pointer-events: none; }
        20%, 30% { opacity: 1; pointer-events: auto; }
      }

      .t1 { animation: popUp 14s infinite 0s; }
      .t2 { animation: popUp 14s infinite 2s; }
      .t3 { animation: popUp 14s infinite 4s; }
      .t4 { animation: popUp 14s infinite 6s; }
      .t5 { animation: popUp 14s infinite 8s; }
      .t6 { animation: popUp 14s infinite 10s; }
      .t7 { animation: popUp 14s infinite 12s; }

      /* Aesthetic Rotations */
      @keyframes rotateClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      /* Hover effects to highlight paths */
      .mole-cluster:hover .universe-line {
        stroke-width: 3;
        stroke: #00ffff;
      }
    </style>
  </defs>

  <g stroke="#1a1936" stroke-width="1">
    <line x1="400" y1="50" x2="400" y2="750" />
    <line x1="50" y1="400" x2="750" y2="400" />
    <polygon points="400,20 410,35 390,35" fill="#1a1936"/>
    <text x="415" y="35" fill="#4a4878" font-size="10" letter-spacing="2">CHRONO-INDEX</text>
  </g>

  <circle cx="400" cy="400" r="300" fill="none" stroke="#2b296b" stroke-width="1.5" />
  <circle cx="400" cy="400" r="300" fill="none" stroke="#00f3ff" stroke-width="2" class="timeline-track" filter="url(#glow-core)" opacity="0.4" />

  <circle cx="400" cy="400" r="8" fill="#00f3ff" filter="url(#glow-core)"/>
  <circle cx="400" cy="400" r="25" fill="none" stroke="#2b296b" stroke-width="1" stroke-dasharray="4 2"/>

  <g class="mole-cluster">
    <line x1="400" y1="400" x2="700" y2="400" stroke="#ff0055" stroke-width="1.5" class="universe-line" opacity="0.7"/>
    <g class="mole-target t1" transform="translate(600, 400)">
      <circle r="18" fill="none" stroke="#ff0055" stroke-width="2" filter="url(#glow-mole)"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ff0055" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ff0055" stroke-width="2"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <g class="mole-cluster">
    <line x1="400" y1="400" x2="587.1" y2="634.5" stroke="#ff5500" stroke-width="1.5" class="universe-line" opacity="0.7"/>
    <g class="mole-target t2" transform="translate(537.2, 572.0)">
      <circle r="18" fill="none" stroke="#ff5500" stroke-width="2" filter="url(#glow-mole)"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ff5500" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ff5500" stroke-width="2"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <g class="mole-cluster">
    <line x1="400" y1="400" x2="333.2" y2="692.5" stroke="#ffcc00" stroke-width="1.5" class="universe-line" opacity="0.7"/>
    <g class="mole-target t3" transform="translate(344.3, 643.7)">
      <circle r="18" fill="none" stroke="#ffcc00" stroke-width="2" filter="url(#glow-mole)"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffcc00" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffcc00" stroke-width="2"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <g class="mole-cluster">
    <line x1="400" y1="400" x2="130.3" y2="530.2" stroke="#00ff66" stroke-width="1.5" class="universe-line" opacity="0.7"/>
    <g class="mole-target t4" transform="translate(228.8, 483.4)">
      <circle r="18" fill="none" stroke="#00ff66" stroke-width="2" filter="url(#glow-mole)"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#00ff66" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#00ff66" stroke-width="2"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <g class="mole-cluster">
    <line x1="400" y1="400" x2="130.3" y2="269.8" stroke="#00f3ff" stroke-width="1.5" class="universe-line" opacity="0.7"/>
    <g class="mole-target t5" transform="translate(156.7, 282.8)">
      <circle r="18" fill="none" stroke="#00f3ff" stroke-width="2" filter="url(#glow-mole)"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#00f3ff" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#00f3ff" stroke-width="2"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <g class="mole-cluster">
    <line x1="400" y1="400" x2="333.2" y2="107.5" stroke="#7700ff" stroke-width="1.5" class="universe-line" opacity="0.7"/>
    <g class="mole-target t6" transform="translate(353.2, 195.2)">
      <circle r="18" fill="none" stroke="#7700ff" stroke-width="2" filter="url(#glow-mole)"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#7700ff" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#7700ff" stroke-width="2"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <g class="mole-cluster">
    <line x1="400" y1="400" x2="587.1" y2="165.5" stroke="#ff00cc" stroke-width="1.5" class="universe-line" opacity="0.7"/>
    <g class="mole-target t7" transform="translate(549.7, 212.4)">
      <circle r="18" fill="none" stroke="#ff00cc" stroke-width="2" filter="url(#glow-mole)"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ff00cc" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ff00cc" stroke-width="2"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <g fill="#7672b3" font-size="11" letter-spacing="1">
    <text x="50" y="720">STATUS: CHRONAL ANOMALIES DETECTED</text>
    <text x="50" y="740" fill="#00f3ff" font-size="12" font-weight="bold">MISSION: CLICK / WHAC TARGETS TO STABILIZE</text>
    
    <text x="560" y="720" text-anchor="end">SYS.DIMENSION: 2D_PLANE</text>
    <text x="560" y="740" text-anchor="end" fill="#ff0055">TEMPORAL MULTIVERSE: 7_ACTIVE</text>
  </g>
</svg>
